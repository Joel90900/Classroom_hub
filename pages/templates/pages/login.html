{% extends "pages/base.html" %}

{% block title %}Log in | ClassroomHub{% endblock %}

{% block content %}
<div class="card-auth" style="border-top: 5px solid var(--primary);">
    <h2 style="display: flex; align-items: center; gap: 0.5rem;">
        <span>🔐</span> Log in
    </h2>

    {% if form.errors %}
        <p class="alert-error">The credentials were not accepted.</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" style="margin-top: 0.5rem;">Log in</button>
    </form>

    <p class="auth-footer">New to ClassroomHub?
        <a href="{% url 'pages:signup' %}">Create an account</a>
    </p>
</div>
{% endblock %}
