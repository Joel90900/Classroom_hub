{% extends "pages/base.html" %}

{% block title %}Sign up | ClassroomHub{% endblock %}

{% block content %}
<div class="card-auth" style="border-top: 5px solid var(--primary);">
    <h2 style="display: flex; align-items: center; gap: 0.5rem;">
        <span>📝</span> Create an account
    </h2>

    <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}
        {{ form.as_p }}
        <button type="submit" style="margin-top: 0.5rem;">Create account</button>
    </form>

    <p class="auth-footer">Already have an account?
        <a href="{% url 'pages:login' %}">Log in</a>
    </p>
</div>
{% endblock %}
